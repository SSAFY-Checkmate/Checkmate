version: '3.8'

services:
  worker:
    image: ${DOCKER_IMAGE}:latest
    container_name: ${CONTAINER_NAME_WORKER}
    networks:
      - checkmate-net
    command: [ "python", "worker_analysis.py" ]
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LLM_MODEL=${LLM_MODEL}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH}
      - LOG_LLM_CALLS=${LOG_LLM_CALLS}
      - LOG_OUTPUT=${LOG_OUTPUT}
      - SAMPLING_MAX_TOKENS_SELECTION=${SAMPLING_MAX_TOKENS_SELECTION}
      - SAMPLING_MAX_TOKENS_DISAMBIGUATION=${SAMPLING_MAX_TOKENS_DISAMBIGUATION}
      - SAMPLING_MAX_TOKENS_DECOMPOSITION=${SAMPLING_MAX_TOKENS_DECOMPOSITION}
      - SAMPLING_MAX_RETRIES=${SAMPLING_MAX_RETRIES}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

networks:
  checkmate-net:
    external: true
