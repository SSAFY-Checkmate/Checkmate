version: '3.8'

services:
  api:
    image: ${DOCKER_IMAGE}:${BUILD_NUMBER}
    container_name: ${CONTAINER_NAME}
    networks:
      - checkmate-net
    ports:
      - "${HOST_PORT}:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LLM_MODEL=${LLM_MODEL}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH}
      - LOG_LLM_CALLS=${LOG_LLM_CALLS}
      - LOG_OUTPUT=${LOG_OUTPUT}
      - SAMPLING_MAX_TOKENS_SELECTION=${SAMPLING_MAX_TOKENS_SELECTION}
      - SAMPLING_MAX_TOKENS_DISAMBIGUATION=${SAMPLING_MAX_TOKENS_DISAMBIGUATION}
      - SAMPLING_MAX_TOKENS_DECOMPOSITION=${SAMPLING_MAX_TOKENS_DECOMPOSITION}
      - SAMPLING_MAX_RETRIES=${SAMPLING_MAX_RETRIES}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  worker:
    image: ${DOCKER_IMAGE}:${BUILD_NUMBER}
    container_name: ${CONTAINER_NAME_WORKER}
    networks:
      - checkmate-net
    command: [ "python", "worker_analysis.py" ]
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LLM_MODEL=${LLM_MODEL}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH}
      - LOG_LLM_CALLS=${LOG_LLM_CALLS}
      - LOG_OUTPUT=${LOG_OUTPUT}
      - SAMPLING_MAX_TOKENS_SELECTION=${SAMPLING_MAX_TOKENS_SELECTION}
      - SAMPLING_MAX_TOKENS_DISAMBIGUATION=${SAMPLING_MAX_TOKENS_DISAMBIGUATION}
      - SAMPLING_MAX_TOKENS_DECOMPOSITION=${SAMPLING_MAX_TOKENS_DECOMPOSITION}
      - SAMPLING_MAX_RETRIES=${SAMPLING_MAX_RETRIES}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

networks:
  checkmate-net:
    external: true
