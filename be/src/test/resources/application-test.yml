spring:
  datasource:
    url: jdbc:h2:mem:checkmate-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile

jwt:
  secret: test-secret-key-test-secret-key-test-secret-key
  access-token-expiration-millis: 1800000
  refresh-token-expiration-millis: 1209600000

oauth2:
  success-redirect-uri: chrome-extension://dummyurl/index.html
