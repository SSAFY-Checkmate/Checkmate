spring:
  application:
    name: checkmate

  # 1. 로컬 데이터베이스 (MySQL) 설정
  datasource:
    url: jdbc:mysql://localhost:3306/checkmate?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root} # 값을 주입하지 않으면 기본값 root 사용
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. JPA 로컬 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 3. 서버 설정
server:
  port: 8080
