spring:
  config:
    activate:
      on-profile: prod

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:be}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      ack-mode: manual
      missing-topics-fatal: false

  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:1800000}
  refresh-token-expiration-millis: ${JWT_REFRESH_TOKEN_EXPIRATION_MILLIS:1209600000}

oauth2:
  success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI}
  redirection-base-uri: ${OAUTH2_REDIRECTION_BASE_URI:/login/oauth2/code/*}

outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    fixed-delay-ms: ${OUTBOX_PUBLISH_FIXED_DELAY_MS:1000}
    batch-size: ${OUTBOX_PUBLISH_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_PUBLISH_MAX_ATTEMPTS:10}
    send-timeout-ms: ${OUTBOX_PUBLISH_SEND_TIMEOUT_MS:5000}

topics:
  analysis:
    requested: ${TOPIC_ANALYSIS_REQUESTED:analysis.requested}
    completed: ${TOPIC_ANALYSIS_COMPLETED:analysis.completed}
    failed: ${TOPIC_ANALYSIS_FAILED:analysis.failed}
  transcript:
    requested: ${TOPIC_TRANSCRIPT_REQUESTED:transcript.requested}
    processing: ${TOPIC_TRANSCRIPT_PROCESSING:transcript.processing}
    completed: ${TOPIC_TRANSCRIPT_COMPLETED:transcript.completed}
    failed: ${TOPIC_TRANSCRIPT_FAILED:transcript.failed}

app:
  services:
    parser:
      base-url: https://k14a405.p.ssafy.io/parser
    ai:
      base-url: https://k14a405.p.ssafy.io/ai
